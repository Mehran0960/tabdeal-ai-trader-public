name: International Spot Strategy Research

on:
  push:
    branches: [main]
    paths:
      - "src/international-strategy-research.js"
      - "scripts/international-strategy-research.mjs"
      - "tests/international-strategy-research.test.mjs"
      - "package.json"
      - ".github/workflows/international-strategy-research.yml"
  schedule:
    - cron: "12 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: international-spot-strategy-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: signal-history
          path: signal-history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax and unit checks
        run: |
          npm run check
          npm test
      - name: Run lean 4h-only fixed-cost OOS and untouched-holdout screen
        run: node scripts/international-strategy-research.mjs --intervals 4h
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: international-spot-strategy-research
          path: artifacts/international-strategy-research/latest.json
          if-no-files-found: error
          retention-days: 30
