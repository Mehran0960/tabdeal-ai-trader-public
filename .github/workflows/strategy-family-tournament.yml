name: Tabdeal Strategy Family Tournament

on:
  workflow_run:
    workflows: ["Tabdeal Dynamic Spot Market History"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "50 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabdeal-strategy-family-tournament
  cancel-in-progress: false

jobs:
  tournament:
    if: github.repository == 'Mehran0960/tabdeal-ai-trader-public' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out private-safe append-only public market history
        uses: actions/checkout@v4
        with:
          ref: signal-history
          path: signal-history
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check tournament and run focused tests
        run: |
          node --check src/strategy-family-tournament.js
          node --check scripts/strategy-family-tournament.mjs
          node --test tests/strategy-family-tournament.test.mjs
      - name: Compare all strategy families across the latest dynamic universe
        run: |
          node scripts/strategy-family-tournament.mjs \
            --history-dir signal-history/data/international-market-history \
            --universe signal-history/data/dynamic-tabdeal-rotation-universe/latest-universe.json
      - name: Upload sanitized tournament report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-strategy-family-tournament-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/strategy-family-tournament/latest.json
          if-no-files-found: warn
          retention-days: 30
