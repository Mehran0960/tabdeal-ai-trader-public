name: Audit the completed Tabdeal one-shot BTCUSDT fill (read only)

on:
  push:
    branches: [main]
    paths:
      - "ops/tabdeal-one-shot-execution-audit.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabdeal-one-shot-fill-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'Mehran0960/tabdeal-ai-trader-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read back fill and commission records
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}
        run: node scripts/tabdeal-one-shot-fill-audit.mjs
