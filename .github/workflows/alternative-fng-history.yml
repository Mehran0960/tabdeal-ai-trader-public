name: Alternative.me Fear and Greed Daily History

on:
  push:
    branches: [main]
    paths:
      - "src/alternative-fng-history.js"
      - "scripts/collect-alternative-fng-history.mjs"
      - ".github/workflows/alternative-fng-history.yml"
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alternative-fng-history
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out append-only sanitized context history
        uses: actions/checkout@v4
        with:
          ref: signal-history
          path: signal-history
          token: ${{ github.token }}
      - name: Capture and append public daily FNG history
        run: node scripts/collect-alternative-fng-history.mjs --history-dir signal-history/data/alternative-fng-history
      - name: Preserve sanitized capture report briefly
        uses: actions/upload-artifact@v4
        with:
          name: alternative-fng-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/alternative-fng-history/latest.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit new daily observations only when changed
        shell: bash
        run: |
          cd signal-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alternative-fng-history/
          if git diff --cached --quiet; then
            echo "No new FNG observations; history unchanged."
          else
            git commit -m "data: append Alternative.me daily sentiment history"
            git push origin signal-history
          fi
